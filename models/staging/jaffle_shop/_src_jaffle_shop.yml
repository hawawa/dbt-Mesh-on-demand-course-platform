sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres database
    config:
      loaded_at_field: _etl_loaded_at
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 30
          period: day
    tables:
      - name: customers
        description: Raw customers data
        config:
          freshness: 
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null 
      - name: orders
        description: Raw order data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null