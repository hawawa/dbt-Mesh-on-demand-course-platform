name: core_platform
version: "2.1.0"
config-version: 2

profile: "snowflake"
require-dbt-version: ">=1.6.0"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  truncate_timespan_to: "{{ current_timestamp() }}"

models:
  core_platform:
    # 3. Require unique and not_null tests for all models in core_platform
    +meta:
      required_tests:
        "unique": 1
        "not_null": 1

    staging:
      +materialized: view

    marts:
      +materialized: table
      # 4. Add relationships test requirement for all marts models
      +meta:
        required_tests:
          "unique": 1
          "not_null": 1
          "relationships": 1